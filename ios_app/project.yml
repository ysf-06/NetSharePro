name: NetSharePro
options:
  bundleIdPrefix: com.netsharepro
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  NetSharePro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NetSharePro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netsharepro.ios
        PRODUCT_NAME: NetSharePro
        INFOPLIST_FILE: NetSharePro/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
